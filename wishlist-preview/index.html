<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Wishlist · Preview</title><style>
*{box-sizing:border-box} :root{--bg:#f5f4ef;--card:#fff;--text:#252823;--muted:#81847b;--line:#e4e5de;--accent:#53674c;--hero:#293c30;color-scheme:light} :root[data-dark]{--bg:#151815;--card:#20251f;--text:#eaece5;--muted:#a3a99e;--line:#363d34;--accent:#b2c6a5;--hero:#344b38;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.shell{max-width:1240px;margin:auto;min-height:100dvh;display:grid;grid-template-columns:210px 1fr}.side{position:sticky;top:0;height:100dvh;border-right:1px solid var(--line);padding:40px 20px;display:flex;flex-direction:column;gap:8px}.brand{font-size:29px;font-weight:750;letter-spacing:-1.8px;margin:0 12px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:600}.side .eyebrow{margin:0 12px 34px}.nav{display:flex;align-items:center;gap:14px;border:0;background:transparent;border-radius:12px;color:var(--muted);padding:14px;text-align:left}.nav.on{background:var(--card);color:var(--accent);font-weight:650}.nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.side footer{margin-top:auto;padding:12px;color:var(--muted);font-size:12px}main{padding:38px 36px 60px;min-width:0;max-width:970px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.top h1{font-size:32px;letter-spacing:-1px;margin:5px 0 0}.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 15px;font-size:13px}.primary{background:var(--accent);color:white;border-color:transparent}:root[data-dark] .primary{color:#172317}.hero{background:var(--hero);color:#f8f8ef;border-radius:20px;padding:26px 28px}.hero .muted{color:#cad3c5}.money{font-size:46px;font-weight:620;letter-spacing:-2px;margin:12px 0 20px;font-variant-numeric:tabular-nums}.spread{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:14px 0}.card{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:20px;min-width:0}.muted{font-size:12px;color:var(--muted);line-height:1.6}.value{font-size:27px;font-weight:650;margin:10px 0 4px;letter-spacing:-.7px}h2{font-size:17px;margin:28px 0 13px}.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.grow{flex:1;min-width:0}.name{font-size:15px;font-weight:640;overflow-wrap:anywhere}.price{white-space:nowrap;font-weight:650;font-variant-numeric:tabular-nums}.art{flex-shrink:0;width:76px;height:66px;display:grid;place-items:center;background:#e9ece5;color:#526155;border-radius:12px}.art svg{width:55px;height:47px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.asset-art{height:125px;width:100%;margin-bottom:14px}.asset-art svg{width:90px;height:85px}.tag{color:var(--accent);font-size:11px;margin-top:6px}.bar{height:6px;border-radius:20px;overflow:hidden;background:var(--line);margin:14px 0 7px}.bar i{display:block;height:100%;background:#8b9d80;border-radius:20px}.filters{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.filter{border:0;padding:9px 13px;border-radius:20px;background:transparent;color:var(--muted)}.filter.on{background:var(--card);color:var(--accent);font-weight:600}.bottom{display:none}.notice{padding:12px 15px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;font-size:13px}.preview{color:var(--muted);font-size:11px;margin-top:28px}dialog{color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:25px;width:min(410px,92vw);max-height:85dvh;overflow:auto}dialog::backdrop{background:#0006}dialog h2{margin:0 0 20px}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}input,select{width:100%;border-radius:9px;background:var(--bg);border:1px solid var(--line);padding:12px;min-width:0}input:focus,select:focus{outline:2px solid var(--accent)}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}.link{color:var(--accent);text-decoration:none}
@media(max-width:700px){.shell{display:block}.side{display:none}main{padding:24px 18px 100px}.top h1{font-size:28px}.hero{padding:23px 20px}.money{font-size:39px}.card{padding:16px}.grid{gap:10px}.art{width:58px;height:56px}.art svg{width:45px}.asset-art{width:100%;height:100px}.asset-art svg{width:72px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;padding:7px 8px max(7px,env(safe-area-inset-bottom));z-index:5}.bottom .nav{flex-direction:column;gap:5px;padding:8px 12px;font-size:11px}.bottom .nav.on{background:var(--bg)}.value{font-size:24px}.row{gap:10px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">Wishlist.</div><div class="eyebrow">PERSONAL COLLECTION</div><div id="sideNav"></div><footer>交互预览 · 演示数据<br>不会影响学习应用</footer></aside><main><div class="top"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1></div><button class="btn" id="theme" aria-label="切换主题">◐</button></div><div id="notice"></div><div id="content"></div><div class="preview">WISHLIST / DESIGN PREVIEW · 演示数据，刷新后重置</div></main></div><nav class="bottom" id="bottomNav"></nav><dialog id="dialog"></dialog><script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>'¥'+Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2}),id=()=>crypto.randomUUID();
let tab=0,filter='全部',fund=5200,reserve=1000,monthly=1000,notice='',mode=null;
let wishes=[{id:id(),name:'AirPods Pro 3',kind:'耳机',spec:'无线耳机',price:1400,status:'待购买'},{id:id(),name:'MacBook Pro M1 Pro',kind:'电脑',spec:'32GB / 512GB · 二手',price:7000,status:'考虑中'},{id:id(),name:'iPad Pro M4',kind:'平板',spec:'256GB',price:7000,status:'考虑中'},{id:id(),name:'Wooting 80HE',kind:'键盘',spec:'磁轴键盘',price:1800,status:'等待中'}],assets=[{id:id(),name:'iPhone 14 Pro',kind:'手机',spec:'使用中',price:null},{id:id(),name:'iPad mini 6',kind:'平板',spec:'64GB · 使用中',price:null},{id:id(),name:'ROG 幻14',kind:'电脑',spec:'2022 款 · 使用中',price:null},{id:id(),name:'AirPods 3',kind:'耳机',spec:'2023.08 · 存在故障',price:null}],ledger=[];
const names=['首页','愿望','预算','资产'],titles=['概览','愿望清单','预算管理','我的资产'];
const icons=['<path d="M3 10l9-7 9 7v10H3zM9 20v-7h6v7"/>','<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>','<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M16 10h5v5h-5a2.5 2.5 0 0 1 0-5z"/>','<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 5v5M15 5v5M10 15h4"/>'];
const nav=()=>names.map((n,i)=>'<button class="nav '+(tab===i?'on':'')+'" data-tab="'+i+'"><svg viewBox="0 0 24 24">'+icons[i]+'</svg>'+n+'</button>').join('');
function art(kind,big=false){const p={'电脑':'<rect x="10" y="8" width="44" height="30" rx="2"/><path d="M10 39H54L61 45H3Z"/><path d="M15 13H49V33H15Z" fill="currentColor" opacity=".12"/>','平板':'<rect x="14" y="3" width="36" height="48" rx="4"/><rect x="18" y="7" width="28" height="40" rx="1" fill="currentColor" opacity=".12"/>','手机':'<rect x="19" y="2" width="26" height="50" rx="5"/><rect x="23" y="7" width="18" height="40" rx="2" fill="currentColor" opacity=".12"/><path d="M29 7h6"/>','耳机':'<rect x="8" y="26" width="48" height="24" rx="10"/><path d="M8 35H56M29 40h6M17 23V13Q17 5 24 5Q32 5 32 13Q32 19 25 19V25M47 23V13Q47 5 40 5Q33 5 33 13Q33 19 40 19V25"/>','键盘':'<rect x="3" y="12" width="58" height="31" rx="4"/>'+Array.from({length:3},(_,r)=>Array.from({length:7},(_,c)=>'<rect x="'+(8+c*7)+'" y="'+(17+r*7)+'" width="4" height="4" rx=".6"/>').join('')).join('')+'<path d="M20 38h24"/>'};return '<div class="art '+(big?'asset-art':'')+'"><svg viewBox="0 0 64 54">'+(p[kind]||'<rect x="12" y="8" width="40" height="40" rx="5"/><path d="M12 20H52M32 8v12"/>')+'</svg></div>';}
const total=()=>wishes.reduce((a,w)=>a+(w.price??0),0),avail=()=>Math.max(0,fund-reserve),bar=(n,d)=>'<div class="bar"><i style="width:'+Math.min(100,n/Math.max(1,d)*100)+'%"></i></div>';
function row(w,action=true){return '<div class="row">'+art(w.kind)+'<div class="grow"><div class="name">'+esc(w.name)+'</div><div class="muted">'+esc(w.spec)+'</div><div class="tag">'+esc(w.status)+'</div></div><div style="text-align:right"><div class="price">'+(w.price==null?'待定':fmt(w.price))+'</div>'+(action?'<button class="btn" style="padding:5px 9px;margin-top:6px" data-detail="'+w.id+'">详情</button>':'')+'</div></div>';}
function home(){const w=wishes[0];return '<section class="hero"><div class="muted">可支配购买资金</div><div class="money">'+fmt(avail())+'</div><div class="spread"><span>资金余额 '+fmt(fund)+'</span><span>保留 '+fmt(reserve)+'</span></div></section><div class="grid"><div class="card"><div class="muted">愿望清单</div><div class="value">'+wishes.length+' 件</div><div class="muted">预计 '+fmt(total())+'</div></div><div class="card"><div class="muted">持有资产</div><div class="value">'+assets.length+' 件</div><div class="muted">个人物品库</div></div></div><h2>近期购买目标</h2>'+(w?'<div class="card">'+row(w,false)+bar(avail(),w.price)+'<div class="muted">'+(avail()>=w.price?'资金已满足购买目标':'还需 '+fmt(w.price-avail()))+'</div></div>':'<div class="card muted">还没有购买目标</div>')+'<h2>其他愿望</h2><div class="card">'+(wishes.slice(1).map(w=>row(w)).join('')||'<span class="muted">暂无</span>')+'</div>';}
function wishlist(){return '<div class="spread"><span class="muted">'+wishes.length+' 个购买目标 · '+fmt(total())+'</span><button class="btn primary" data-add>＋ 添加</button></div><div class="filters">'+['全部','考虑中','等待中','待购买'].map(f=>'<button class="filter '+(filter===f?'on':'')+'" data-filter="'+f+'">'+f+'</button>').join('')+'</div><div class="card">'+(wishes.filter(w=>filter==='全部'||w.status===filter).map(w=>row(w)).join('')||'<span class="muted">暂无商品</span>')+'</div>';}
function budget(){return '<div class="hero"><div class="muted">购物资金余额</div><div class="money">'+fmt(fund)+'</div><button class="btn" style="background:#ffffff15;color:white;border-color:#ffffff35" data-deposit>＋ 存入资金</button></div><div class="grid"><div class="card"><div class="muted">最低保留</div><div class="value">'+fmt(reserve)+'</div></div><div class="card"><div class="muted">月度预计存入</div><div class="value">'+fmt(monthly)+'</div></div></div><h2 class="spread">资金配置 <button class="btn" data-config>修改</button></h2><div class="card"><div class="muted">可购买资金</div><div class="value">'+fmt(avail())+'</div>'+bar(avail(),total())+'<div class="muted">清单总额 '+fmt(total())+' · 缺口 '+fmt(Math.max(0,total()-avail()))+'</div><p class="muted">预计全部资金准备：'+(total()<=avail()?'已满足':monthly?Math.ceil((total()-avail())/monthly)+' 个月':'未设置月度预算')+'</p></div><h2>资金变动</h2><div class="card">'+(ledger.map(l=>'<div class="row"><div class="grow">'+esc(l.name)+'</div><strong>'+(l.amount>=0?'+':'−')+fmt(Math.abs(l.amount))+'</strong></div>').join('')||'<div class="muted">暂无新增资金或购买记录</div>')+'</div>';}
function assetPage(){return '<div class="spread"><span class="muted">共 '+assets.length+' 件资产</span><button class="btn primary" data-asset>＋ 录入</button></div><div class="grid">'+assets.map(a=>'<div class="card">'+art(a.kind,true)+'<div class="name">'+esc(a.name)+'</div><div class="muted">'+esc(a.spec)+'</div>'+(a.price!=null?'<p class="price">'+fmt(a.price)+'</p>':'')+'</div>').join('')+'</div>';}
function render(){ $('#sideNav').innerHTML=nav();$('#bottomNav').innerHTML=nav();$('#eyebrow').textContent='YOUR COLLECTION / 0'+(tab+1);$('#title').textContent=titles[tab];$('#notice').innerHTML=notice?'<div class="notice" role="status">'+esc(notice)+'</div>':'';$('#content').innerHTML=[home,wishlist,budget,assetPage][tab]();}
function field(label,key,value='',type='text'){return '<label for="'+key+'">'+label+'</label><input id="'+key+'" type="'+type+'" value="'+esc(value)+'" '+(type==='number'?'min="0" step="0.01"':'')+'>';}
function select(label,key,values,current){return '<label for="'+key+'">'+label+'</label><select id="'+key+'">'+values.map(v=>'<option '+(v===current?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select>';}
function open(type,wid){mode={type,wid};let h='';const actions=(buttons)=>'<div class="actions"><button class="btn" data-close>取消</button>'+buttons+'</div>';if(type==='detail'){const w=wishes.find(w=>w.id===wid);h='<h2>'+esc(w.name)+'</h2>'+art(w.kind,true)+field('商品名称','nm',w.name)+field('规格与备注','spec',w.spec)+field('目标价格','price',w.price??'','number')+select('购买状态','status',['考虑中','等待中','待购买'],w.status)+field('实际成交价格','actual',w.price??'','number')+actions('<button class="btn" data-save>保存</button><button class="btn primary" data-buy>确认购买</button>');}else if(type==='add'||type==='asset'){h='<h2>'+(type==='add'?'添加愿望':'录入已有资产')+'</h2>'+field('商品名称','nm')+field('规格或备注','spec')+select('类别','kind',['电脑','平板','手机','耳机','键盘','其他'],'其他')+field('价格（选填）','price','','number')+actions('<button class="btn primary" data-create>添加</button>');}else if(type==='deposit'){h='<h2>存入购物资金</h2>'+field('金额','amount','','number')+actions('<button class="btn primary" data-confirm-deposit>确认</button>');}else{h='<h2>预算设置</h2>'+field('最低保留资金','reserve',reserve,'number')+field('月度预计新增','monthly',monthly,'number')+actions('<button class="btn primary" data-apply>保存</button>');}$('#dialog').innerHTML=h;$('#dialog').showModal();}
const val=k=>$('#'+k).value,number=k=>{const v=val(k).trim(),n=Number(v);return v!==''&&Number.isFinite(n)&&n>=0?Math.round(n*100)/100:null;};function close(){if($('#dialog').open)$('#dialog').close();mode=null;}function notify(s){notice=s;close();render();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(b.id==='theme'){document.documentElement.toggleAttribute('data-dark');return;}if(d.tab!==undefined){tab=Number(d.tab);notice='';render();return;}if(d.filter!==undefined){filter=d.filter;render();return;}if(d.detail!==undefined){open('detail',d.detail);return;}if(d.add!==undefined){open('add');return;}if(d.asset!==undefined){open('asset');return;}if(d.deposit!==undefined){open('deposit');return;}if(d.config!==undefined){open('config');return;}if(d.close!==undefined){close();return;}if(!mode)return;
if(d.create!==undefined){const name=val('nm').trim();if(!name){$('#nm').focus();return;}const o={id:id(),name,spec:val('spec'),kind:val('kind'),price:number('price')};if(mode.type==='add')wishes.push({...o,status:'考虑中'});else assets.push({...o,spec:o.spec||'使用中'});notify('已添加');}
else if(d.save!==undefined){const w=wishes.find(w=>w.id===mode.wid);w.name=val('nm').trim()||w.name;w.spec=val('spec');w.price=number('price');w.status=val('status');notify('已保存');}
else if(d.buy!==undefined){const w=wishes.find(w=>w.id===mode.wid),price=number('actual');if(price===null){$('#actual').focus();return;}if(price>avail()){notify('资金不足：购买将突破最低保留金额');return;}const name=val('nm').trim()||w.name;assets.push({id:id(),name,kind:w.kind,spec:val('spec')||'使用中',price});fund=Math.round((fund-price)*100)/100;ledger.unshift({name,amount:-price});wishes=wishes.filter(x=>x.id!==w.id);notify('购买完成 · 已扣除 '+fmt(price)+' 并转入资产库');}
else if(d.confirmDeposit!==undefined){const n=number('amount');if(n===null||n<=0){$('#amount').focus();return;}fund=Math.round((fund+n)*100)/100;ledger.unshift({name:'存入资金',amount:n});notify('资金已存入');}
else if(d.apply!==undefined){const r=number('reserve'),m=number('monthly');if(r===null||m===null)return;reserve=r;monthly=m;notify('预算已更新');}});
$('#dialog').addEventListener('close',()=>{mode=null;});render();
</script></body></html>
