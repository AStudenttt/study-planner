 const entry=(amount,label,kind,ref)=>{check(Number.isSafeInteger(amount)&&Math.abs(amount)<=100000000000,'金额无效');s.ledger[id]={id,amount,label,kind,ref,date:at};};
 switch(o.type){
 case 'addWish':check(!s.wishes[p.item.id]&&p.item.name,'愿望无效');s.wishes[p.item.id]={...p.item,rev:id};s.order.push(p.item.id);break;
 case 'editWish':{const w=wish(p.key);check(w.status!=='bought','商品已购买');s.wishes[p.key]={...p.item,id:p.key,rev:id};break;}
 case 'archive':{const w=wish(p.key);check(w.status!=='bought','商品已购买');w.status=p.status;w.rev=id;break;}
 case 'order':check(equal(active(s),p.before),'购买顺序已变化');check(p.after.length===p.before.length&&new Set(p.after).size===p.after.length&&p.after.every(k=>p.before.includes(k)),'顺序无效');s.order=[...p.after,...s.order.filter(k=>!p.after.includes(k))];break;

 case 'addAsset':check(!s.assets[p.item.id]&&p.item.name,'资产无效');s.assets[p.item.id]={...p.item,rev:id};break;

 }

}
function replay(base,ops){let state=base,done=[],remaining=[];let error='';for(let i=0;i<ops.length;i++){try{state=apply(state,ops[i]);done.push(ops[i]);}catch(e){remaining=ops.slice(i);error=e.message;break;}}return {state,done,remaining,error};}
function price(w){const c=(w.candidates||[]).find(x=>x.id===w.selected);return c?.price??w.price??null;}
function projection(s,skip=[]){let sum=0,unknown=false;const avail=Math.max(0,balance(s)-s.settings.reserve);return active(s).filter(id=>!skip.includes(id)).map(id=>{const w=s.wishes[id],p=price(w);if(p===null)unknown=true;else sum+=p;const gap=Math.max(0,sum-avail);return {id,p,allocated:p===null||unknown?null:Math.max(0,Math.min(p,avail-(sum-p))),months:unknown?null:gap===0?0:s.settings.monthly?Math.ceil(gap/s.settings.monthly):null,gap:unknown?null:gap};});}

const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID(),now=()=>new Date().toISOString(),date=()=>new Date().toLocaleDateString('sv-SE'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=x=>x===null||x===undefined?'待定':'¥'+(x/100).toLocaleString('zh-CN',{maximumFractionDigits:2}),val=k=>$('#'+k).value,amount=(k,required=false)=>{const v=val(k).trim();if(!v&&!required)return null;const n=Math.round(Number(v)*100);check(v!==''&&cents(n),'请输入有效金额');return n},yuan=x=>x==null?'':x/100,labels={consider:'考虑中',waiting:'等待中',ready:'待购买',archived:'已归档',bought:'已购买',using:'使用中',idle:'闲置',fault:'故障',sold:'已出售',returned:'已退货',retired:'已淘汰'},cats=['数码','电脑','手机','平板','耳机','外设','服饰','生活','其他'];
const KEY='wishlist-app-v1',TOKEN='wishlist-token-v1',ROOT='https://api.github.com/repos/AStudenttt/wishlist-data',PATH='/contents/wishlist.json';
let store={base:blank(),pending:[],version:0},fatal='',token='',state=blank(),tab=0,filter='active',assetFilter='held',search='',notice='',syncText='本地模式',busy=false,restoring=false,conflict='',timer,backoff=0,nextRetry=0,modal=null,photo='',draftCandidates=[],skip=new Set(),drag=null,quickDraft='';
try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);check(valid(x.base)&&Array.isArray(x.pending),'本地数据无法读取');store=x;}token=localStorage.getItem(TOKEN)||'';const th=localStorage.getItem('wishlist-theme');if(th)document.documentElement.dataset.theme=th;}catch(e){fatal=e.message;}
function rebuild(){const r=replay(store.base,store.pending);state=r.state;conflict=r.error;return r}
rebuild();
function persist(next){check(!fatal,'本地存储异常，已暂停写入');const current=localStorage.getItem(KEY);check(!current||equal(JSON.parse(current),store),'另一窗口已修改，请刷新本页后继续');localStorage.setItem(KEY,JSON.stringify(next));store=next;rebuild();}
function show(msg){notice=msg;render();}
function commit(type,p){check(!restoring,'正在恢复历史版本');check(!conflict,'请先处理待同步冲突');const o={id:uid(),at:now(),type,p};apply(state,o);persist({...store,pending:[...store.pending,o]});close();show('已保存');schedule();}
const icons=['<path d="M3 10l9-7 9 7v10H3zM9 20v-7h6v7"/>','<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>','<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M16 10h5v5h-5a2.5 2.5 0 0 1 0-5z"/>','<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 5v5M15 5v5M10 15h4"/>'];
const ico=i=>'<svg class="ico" viewBox="0 0 24 24">'+icons[i]+'</svg>',names=['概览','愿望清单','预算','资产'],nav=()=>names.map((n,i)=>'<button class="nav '+(i===tab?'on':'')+'" data-tab="'+i+'">'+ico(i)+n+'</button>').join('');
function pic(x){return '<div class="pic">'+(/^data:image\/(?:jpeg|png|webp);base64,[a-z0-9+/=]+$/i.test(x.photo||'')?'<img alt="" src="'+esc(x.photo)+'">':ico(3))+'</div>'}
const empty=(t,b='',i=1)=>'<div class="empty">'+ico(i)+'<p>'+esc(t)+'</p>'+b+'</div>',btn=(t,attrs='',cls='')=>'<button class="button '+cls+'" '+attrs+'>'+t+'</button>',metric=(label,v,sub='')=>'<div class="card"><div class="muted">'+label+'</div><div class="money">'+v+'</div><div class="muted">'+sub+'</div></div>';
function wrow(w,index,proj,orderable=true){const p=price(w),candidate=w.candidates?.find(c=>c.id===w.selected);return '<div class="row" '+(orderable?'draggable="true" data-drag="'+w.id+'"':'')+'>'+(orderable?'<div class="order"><button aria-label="上移" data-move="'+w.id+'" data-dir="-1">▲</button>'+String(index+1).padStart(2,'0')+'<button aria-label="下移" data-move="'+w.id+'" data-dir="1">▼</button></div>':'')+pic(w)+'<div class="grow"><button class="plain name" style="text-align:left;padding:0;color:var(--ink)" data-wish="'+w.id+'">'+esc(w.name)+'</button><div class="muted">'+esc(candidate?.name||w.spec||w.category)+' · '+labels[w.status]+'</div>'+(proj&&proj.p!==null&&proj.allocated!==null?'<div class="bar"><b style="width:'+Math.min(100,proj.allocated/Math.max(1,p)*100)+'%"></b></div><div class="muted">'+(proj.months===0?'资金已满足':proj.months===null?'未设置月度计划':proj.months+' 个月后')+'</div>':'')+'</div><div style="text-align:right"><div class="price">'+money(p)+'</div>'+btn('编辑','data-wish="'+w.id+'"','small')+(active(state).includes(w.id)?' '+btn('购买','data-buy="'+w.id+'"','small'):'')+'</div></div>'}

 if(d.discard!==undefined){check(conflict&&!busy,'无待处理冲突');if(!confirm('先确认已保存保护备份。丢弃尚未提交的冲突队列？'))return;const r=rebuild();persist({...store,pending:r.done});open('settings');render();schedule();return}
 if(d.history!==undefined){await history();return}
 if(d.restore!==undefined){await restore(d.restore);return}
 }catch(e){err(e);}});
document.addEventListener('input',e=>{if(e.target.id==='quickName')quickDraft=e.target.value;if(e.target.id==='search'){search=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos);}});
document.addEventListener('change',async e=>{try{const el=e.target;if(el.id==='importFile'&&el.files[0]){check(!token&&!busy,'请先断开云端连接');const x=JSON.parse(await el.files[0].text());check(x.format==='wishlist-backup-v1'&&valid(x.base)&&Array.isArray(x.pending)&&Number.isSafeInteger(x.version),'备份格式不兼容');const recovered=replay(x.base,x.pending);check(!recovered.error,'备份中存在冲突，请保留原文件');if(confirm('恢复备份会替换当前本地数据。请先导出当前备份。确定恢复？')){persist({base:x.base,pending:x.pending,version:x.version});close();show('本地备份已恢复');}return;}if(el.dataset.skip){el.checked?skip.delete(el.dataset.skip):skip.add(el.dataset.skip);render();}if(el.id==='theme'){const v=el.value;localStorage.setItem('wishlist-theme',v);document.documentElement.dataset.theme=v;}if(el.id==='photoFile'&&el.files[0]){const f=el.files[0],m=modal;check(f.size<=20000000,'图片过大');const url=URL.createObjectURL(f);try{const img=new Image();img.src=url;await img.decode();const scale=Math.min(1,480/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*scale));cv.height=Math.max(1,Math.round(img.height*scale));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);let p=cv.toDataURL('image/jpeg',.72);if(p.length>95000)p=cv.toDataURL('image/jpeg',.42);check(p.length<95000,'图片压缩后仍过大');if(modal!==m)return;photo=p;$('#photoPreview').querySelector('.pic').outerHTML=pic({photo});}finally{URL.revokeObjectURL(url);}}}catch(e){err(e);}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='quickName'){e.preventDefault();document.querySelector('[data-quick]').click();}});
document.addEventListener('dragstart',e=>{const x=e.target.closest('[data-drag]');if(x){drag=x.dataset.drag;e.dataTransfer.setData('text/plain',drag);}});
document.addEventListener('dragover',e=>{if(drag&&e.target.closest('[data-drag]'))e.preventDefault();});
document.addEventListener('drop',e=>{const x=e.target.closest('[data-drag]');if(x&&drag){e.preventDefault();try{move(drag,0,x.dataset.drag)}catch(e){err(e)}}drag=null;});
document.addEventListener('dragend',()=>drag=null);
function exportData(){const blob=new Blob([JSON.stringify({format:'wishlist-backup-v1',...store},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='wishlist-backup-'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
const encode=s=>{const u=new TextEncoder().encode(s);let b='';for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(b)},decode=s=>new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
async function api(path,method='GET',body){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),15000);try{const r=await fetch(ROOT+path,{method,headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store',signal:ctl.signal});const j=await r.json();if(!r.ok){const e=Error(r.status===401?'令牌无效或过期':r.status===403?'权限不足或 API 限流':r.status===404?'仓库或文件不可访问':'GitHub '+r.status);e.status=r.status;throw e;}return j;}finally{clearTimeout(t)}}
async function verify(){const r=await api('');check(r.private===true&&r.full_name.toLowerCase()==='astudenttt/wishlist-data','必须使用指定私有仓库');}
async function read(ref='main'){let f;try{f=await api(PATH+'?ref='+encodeURIComponent(ref));}catch(e){if(e.status!==404||ref!=='main')throw e;await verify();return {version:0,state:blank(),sha:null};}check(f.type==='file'&&f.encoding==='base64','文件格式或大小不支持');const x=JSON.parse(decode(f.content));check(valid(x.state)&&Number.isSafeInteger(x.version)&&x.version>0,'云端数据格式不兼容');return {...x,sha:f.sha};}
async function write(remote,s,message){await verify();const obj={version:remote.version+1,updated:now(),state:s};const content=encode(JSON.stringify(obj));check(content.length<1250000,'云端文件达到容量限制，操作仍保存在本机');const r=await api(PATH,'PUT',{message,content,branch:'main',...(remote.sha?{sha:remote.sha}:{})});check(r.content?.sha,'写入未确认');return obj;}
function schedule(){clearTimeout(timer);if(token)timer=setTimeout(()=>sync(),1200);}
async function sync(force=false){if(!token||busy||fatal||(!force&&(document.hidden||Date.now()<nextRetry)))return;if(!navigator.onLine){syncText='离线 · 本地保存';render();return}busy=true;const priorState=state,priorConflict=conflict;try{syncText='同步中';updateStatus();await verify();const remote=await read();if(store.version>0&&!remote.sha)throw Error('云端文件缺失，停止自动覆盖');const queued=[...store.pending];const r=replay(remote.state,queued);let committed=remote;const changed=r.done.some(o=>!remote.state.seen[o.id]);if(changed||(!remote.sha&&!r.error))committed=await write(remote,r.state,remote.sha?'Sync wishlist operations':'Initialize wishlist data');const accepted=new Set(r.done.map(o=>o.id));const remaining=store.pending.filter(o=>!accepted.has(o.id));persist({base:committed.state,pending:remaining,version:committed.version});syncText=conflict?'待处理冲突':store.pending.length?'等待同步':'云端已同步';backoff=0;nextRetry=0;if(store.pending.length&&!conflict)schedule();}catch(e){backoff=Math.min(backoff+1,5);nextRetry=Date.now()+Math.min(120000,5000*2**backoff);syncText=e.name==='AbortError'?'网络超时':e.message;}finally{busy=false;if(!equal(priorState,state)||priorConflict!==conflict)render();else updateStatus();}}
async function history(){check(token&&!busy,'请先连接并等待同步完成');busy=true;try{await verify();const rows=await api('/commits?sha=main&path=wishlist.json&per_page=50');$('#history').innerHTML='<div class="history">'+rows.map(x=>'<div class="row"><div class="grow muted">'+esc(new Date(x.commit.committer.date).toLocaleString())+' · '+esc(x.commit.message)+'</div>'+btn('恢复','data-restore="'+x.sha+'"')+'</div>').join('')+'</div>';}finally{busy=false;}}
async function restore(ref){check(token&&!busy&&!store.pending.length,'请先完成同步');check(/^[0-9a-f]{40}$/.test(ref),'版本无效');if(!confirm('用所选历史版本恢复云端？当前版本仍保留于 Git 历史。'))return;busy=true;restoring=true;try{await verify();const remote=await read(),old=await read(ref);check(remote.version===store.version&&equal(remote.state,store.base),'云端已变化，请先同步');const s={...old.state,seen:{...remote.state.seen,...old.state.seen}};const x=await write(remote,s,'Restore wishlist history');persist({base:x.state,pending:[],version:x.version});syncText='已恢复云端版本';close();render();}finally{busy=false;restoring=false;}}
window.addEventListener('storage',e=>{if(e.key===KEY&&!busy&&!$('#dialog').open){try{const next=JSON.parse(e.newValue);if(valid(next.base)&&Array.isArray(next.pending)){store=next;rebuild();render();}}catch(_){} }});setInterval(()=>sync(),15000);window.addEventListener('online',()=>{nextRetry=0;sync(true)});window.addEventListener('offline',()=>{syncText='离线 · 本地保存';render()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});render();if(token)sync(true);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
